name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm run test -- --passWithNoTests --coverage
        env:
          NODE_ENV: test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigp
          POSTGRES_PASSWORD: sigp_dev_pass
          POSTGRES_DB: sigp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sigp:sigp_dev_pass@localhost:5432/sigp_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 1
      JWT_SECRET: ci-test-secret-min-32-chars-long-xx
      JWT_ACCESS_TOKEN_TTL: 900
      JWT_REFRESH_TOKEN_TTL: 604800
      JWT_REFRESH_TOKEN_GRACE: 30
      LOG_LEVEL: error
      LOG_PRETTY: "false"
      METRICS_ENABLED: "false"
      UPLOAD_MAX_SIZE_MB: "5"
      UPLOAD_ALLOWED_MIME_TYPES: application/pdf,image/jpeg
      THROTTLE_TTL: "60000"
      THROTTLE_LIMIT: "1000"
      THROTTLE_AUTH_LIMIT: "100"
      ANTIVIRUS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate JWT keys
        run: |
          mkdir -p keys
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const { privateKey, publicKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
            fs.writeFileSync('keys/private.pem', privateKey.export({ type: 'pkcs8', format: 'pem' }));
            fs.writeFileSync('keys/public.pem', publicKey.export({ type: 'spki', format: 'pem' }));
          "
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run migrations
        run: npx prisma migrate deploy
      - name: Run E2E tests
        run: npm run test:e2e
