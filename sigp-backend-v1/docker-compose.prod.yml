services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-organisation/sigp-api}:${IMAGE_TAG:-latest}
    container_name: sigp-api
    env_file: .env.production
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigp-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: sigp-pgbouncer
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: sigp_prod
      POSTGRESQL_USERNAME: sigp
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 30
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigp-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  db:
    image: postgres:16-alpine
    container_name: sigp-db
    environment:
      POSTGRES_USER: sigp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sigp_prod
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - sigp-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigp -d sigp_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: sigp-redis
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis-prod:/data
    networks:
      - sigp-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: sigp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes:
      - minio-prod:/data
    networks:
      - sigp-internal
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  clamav:
    image: clamav/clamav:stable
    container_name: sigp-clamav
    networks:
      - sigp-internal
    volumes:
      - clamav-db:/var/lib/clamav
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sigp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sigp-internal
    restart: always

volumes:
  pgdata-prod:
  redis-prod:
  minio-prod:
  clamav-db:

networks:
  sigp-internal:
    driver: bridge
    internal: true
