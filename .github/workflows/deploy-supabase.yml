name: Deploy Supabase (Migrations & Edge Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch: # Permet aussi de lancer le déploiement manuellement depuis un bouton sur GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: alwueihbddrupomwiwmv
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation de la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Liaison au projet et Application des nouvelles migrations SQL (db push)
        run: |
          echo "Liaison au projet $SUPABASE_PROJECT_ID et vérification des migrations..."
          supabase link --project-ref $SUPABASE_PROJECT_ID --password "${{ secrets.SUPABASE_DB_PASSWORD }}" || echo "ℹ️ Note: Liaison effectuée avec le jeton ou la configuration par défaut."
          if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
          else
            supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          fi

      - name: Déploiement des Edge Functions (backend Deno)
        run: |
          echo "Déploiement de toutes les Edge Functions vers le projet $SUPABASE_PROJECT_ID..."
          supabase functions deploy --project-ref $SUPABASE_PROJECT_ID
