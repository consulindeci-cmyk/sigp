services:
  - type: web
    name: sigp-backend-v1
    env: docker
    rootDir: sigp-backend-v1
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Secrets — jamais en clair dans ce fichier. Valeurs définies manuellement
      # dans le dashboard Render (Settings > Environment).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: API_PREFIX
        value: api
      - key: FRONTEND_URL
        value: https://sigp-frontend-delta.vercel.app
      - key: CORS_ORIGINS
        value: "https://sigp-frontend-delta.vercel.app"
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: REDIS_HOST
        value: localhost
